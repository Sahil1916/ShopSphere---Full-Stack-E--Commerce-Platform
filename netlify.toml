[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# IMPORTANT:
# After creating the Render service, replace YOUR-RENDER-SERVICE below
# with your real Render hostname. Keeping /api proxied through Netlify
# lets the browser use a same-origin session cookie.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

# React Router fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
